<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sunflow.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sunflow</title>
    <link rel="stylesheet" href="./src/index.css" />
  </head>
  <body>
    <div id="root">
      <main class="auth-loading">
        <div class="auth-loading__rise">
          <img src="/sunflow.svg" class="auth-loading__spinner" />
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<style>
  #root {
    min-height: 100vh;
  }
  
  .auth-loading {
    height: 100vh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .auth-loading__rise {
    animation: rise-fade 0.6s cubic-bezier(0.34, 1.6, 0.64, 1) forwards;
  }

  .auth-loading__spinner {
    width: 40px;
    height: 40px;
    animation: slow-spin 2s linear infinite;
  }

  @keyframes rise-fade {
    from {
      opacity: 0;
      transform: translateY(50px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes slow-spin {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }
</style>
